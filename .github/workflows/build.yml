name: Build & release

on: [push, pull_request, workflow_dispatch]

jobs:
  release:
    uses: RyanHecht/layerview/.github/workflows/zmk-release.yml@main
    permissions:
      contents: write
    with:
      keymap: config/glove80.keymap
      zmk_keyboard: glove80
      keyboard_name: Glove80
      export_args: >-
        --label "&kp LG(LA(SPACE))=Dictate"
        --label "&gc_chat_t=T chat" --label "&gc_chat_slash=/ chat" --label "&gc_super=Super"
        --label "&gc_send=Enter" --label "&gc_cancel=Esc"
      targets: >-
        [{"name": "left", "file_glob": "*glove80_lh*.uf2", "volume_label": "GLV80LHBOOT",
          "hint": "plug the left half in directly, hold Magic (bottom-left corner), tap Esc (left of A)", "central": true},
         {"name": "right", "file_glob": "*glove80_rh*.uf2", "volume_label": "GLV80RHBOOT",
          "hint": "plug the right half in by USB, hold Magic, tap ' (right of ;)", "central": false}]
