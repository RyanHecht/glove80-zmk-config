# Firmware sources, pinned to known commits.
manifest:
  remotes:
    - name: moergo-sc
      url-base: https://github.com/moergo-sc
    - name: darknao
      url-base: https://github.com/darknao
    - name: zzeneg
      url-base: https://github.com/zzeneg
    - name: srwi
      url-base: https://github.com/srwi
    - name: ryanhecht
      url-base: https://github.com/RyanHecht
  projects:
    # MoErgo's ZMK v26.09 + per-key/per-layer RGB (moergo-sc/zmk PR #36, darknao:rgb-layer-24.12)
    - name: zmk
      remote: darknao
      revision: 22d6941d055bf05f006c9d4d7088e9564d31ba3a
      import: app/west.yml
    # Raw HID transport (USB + BLE)
    - name: zmk-raw-hid
      remote: zzeneg
      revision: 6a37765dfab6197292e7a9f47305dcf87386d56a
    # KeyPeek: reports active layers + key positions, tunnels Studio RPC over Raw HID
    - name: zmk-keypeek-layer-notifier
      remote: srwi
      revision: 23a9e46287e083a66d1d6f1939f68efb1f0f5295
    # layerview: lets the computer switch layers (focus rules, e.g. Gaming while Minecraft is focused)
    - name: layerview
      remote: ryanhecht
      revision: 5597d4f7d8aa308bb5093755243ccbdfbca99997
  self:
    path: config
