# Raw HID endpoint for the KeyPeek layer notifier (live layer display).
CONFIG_RAW_HID=y

# Mouse keys / pointing (TailorKey's Mouse layers).
CONFIG_ZMK_POINTING=y

# Per-key LED colors for mode layers (PR #36); see config/rgb_layers.dtsi.
CONFIG_EXPERIMENTAL_RGB_LAYER=y
# Turn the LEDs off after the keyboard idles (protects the right half's battery).
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
